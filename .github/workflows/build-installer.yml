name: build-installer

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v1
      - name: Restore packages
        run: nuget restore
      - name: Build x64 Release
        run: msbuild HashCheck.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
      - name: Build ARM64 Release
        run: msbuild HashCheck.sln /p:Configuration=Release /p:Platform=ARM64 /p:PlatformToolset=v143
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build installer (x64)
        shell: pwsh
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" /DOUTFILE_SUFFIX=-x64 installer\HashCheck.nsi'
      - name: Build installer (arm64)
        shell: pwsh
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" /DARCH_ARM64 /DOUTFILE_SUFFIX=-arm64 installer\HashCheck.nsi'
      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path installer -Filter "HashCheckSetup-v*.exe"
          if (-not $installers) { throw "Installer not found" }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
            "$hash *$($installer.Name)" | Out-File -FilePath "$($installer.FullName).sha256" -Encoding ascii
          }
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hashcheck-installer
          path: |
            installer/HashCheckSetup-v*.exe
            installer/HashCheckSetup-v*.exe.sha256
